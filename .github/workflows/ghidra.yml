name: Build the thing


on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build-the-extension:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ghidra:
          - "12.0.1"
          - "11.4.2"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: antoniovazquezblanco/setup-ghidra@v2
        with:
          version: ${{ matrix.ghidra }}
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build something with Ghidra ${{ matrix.ghidra }}
        run: ./gradlew -PGHIDRA_INSTALL_DIR=${{ env.GHIDRA_INSTALL_DIR }} buildExtension
      - name: Show me the dir
        run: ls -lt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ghidra }}
          path: dist
